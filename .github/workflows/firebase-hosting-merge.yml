name: Firebase Hosting DEV Live

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy_dev:
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: dev
      VITE_BUILD_SHA: ${{ github.sha }}
      VITE_BUILD_RUN: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build DEV
        run: npm run build

      - name: Deploy live to Firebase Hosting DEV
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CCNSA_WEB_DEV }}
          projectId: ccnsa-web-dev
          channelId: live
