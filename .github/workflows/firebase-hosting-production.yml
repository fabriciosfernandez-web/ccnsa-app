name: Firebase Hosting PROD

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Escribí CCNSA-PROD para habilitar el despliegue'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  build_and_deploy_prod:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_APP_ENV: prod
      VITE_BUILD_SHA: ${{ github.sha }}
      VITE_BUILD_RUN: ${{ github.run_number }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY_PROD }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN_PROD }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID_PROD }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET_PROD }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID_PROD }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID_PROD }}
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY_PROD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate explicit production confirmation
        run: test "${{ inputs.confirm_production }}" = "CCNSA-PROD"

      - name: Validate production target
        run: |
          test "$VITE_FIREBASE_PROJECT_ID" = "ccnsa-web-prod"
          test -n "$VITE_FIREBASE_API_KEY"
          test -n "$VITE_FIREBASE_AUTH_DOMAIN"
          test -n "$VITE_FIREBASE_APP_ID"

      - name: Build PROD
        run: npm run build

      - name: Deploy live to Firebase Hosting PROD
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CCNSA_WEB_PROD }}
          projectId: ccnsa-web-prod
          channelId: live
